<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>单词记忆</title>
  <style>
    :root {
      --bg: #edf4ef;
      --panel: rgba(255, 255, 255, 0.72);
      --panel-2: rgba(247, 250, 247, 0.9);
      --line: rgba(103, 122, 104, 0.2);
      --text: #203023;
      --muted: #637164;
      --accent: #587a71;
      --accent-strong: #446359;
      --accent-soft: rgba(88, 122, 113, 0.16);
      --danger: #9a5252;
      --shadow: 0 18px 44px rgba(39, 57, 44, 0.1);
      --shadow-soft: 0 10px 26px rgba(39, 57, 44, 0.07);
      --radius: 16px;
      --radius-lg: 22px;
      --radius-xl: 28px;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-emph: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; }
    ::selection {
      background: rgba(88, 122, 113, 0.18);
      color: var(--text);
    }
    html, body { height: 100%; }
    html {
      color-scheme: light;
    }
    body {
      margin: 0;
      font-family: "SF Pro Text", "SF Pro Display", "PingFang SC",
        "Hiragino Sans GB", "Avenir Next", "Segoe UI", system-ui, sans-serif;
      background:
        linear-gradient(145deg, #f9fbf8 0%, #eef4ef 38%, #e9f2ee 68%, #f6f7f2 100%);
      background-attachment: fixed;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.66), rgba(255, 255, 255, 0) 40%),
        linear-gradient(180deg, rgba(86, 119, 109, 0.08), rgba(86, 119, 109, 0) 28%),
        linear-gradient(0deg, rgba(236, 243, 239, 0.24), rgba(236, 243, 239, 0) 48%);
      opacity: 0.92;
    }

    body::after {
      background:
        linear-gradient(120deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.18) 14%, rgba(255, 255, 255, 0) 28%),
        linear-gradient(300deg, rgba(86, 119, 109, 0.05) 0%, rgba(86, 119, 109, 0) 42%);
      opacity: 0.72;
    }

    button, input {
      font: inherit;
    }

    button {
      position: relative;
      min-height: 44px;
      border: 1px solid transparent;
      background: transparent;
      color: inherit;
      padding: 0 14px;
      border-radius: var(--radius);
      cursor: pointer;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      will-change: transform, box-shadow, background-color, border-color, opacity;
      transition:
        transform 180ms var(--ease-out),
        background-color 180ms var(--ease-out),
        border-color 180ms var(--ease-out),
        color 180ms var(--ease-out),
        box-shadow 180ms var(--ease-out),
        opacity 180ms var(--ease-out);
    }

    button:hover { transform: translateY(-1px); }
    button:active,
    button.is-pressed { transform: translateY(1px) scale(0.985); }
    button[disabled],
    button[aria-busy="true"] {
      cursor: not-allowed;
      opacity: 0.54;
      transform: none;
      box-shadow: none;
    }
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid rgba(88, 122, 113, 0.28);
      outline-offset: 3px;
    }

    button .ripple {
      position: absolute;
      border-radius: 999px;
      pointer-events: none;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 255, 255, 0.58) 0%, rgba(255, 255, 255, 0.2) 38%, rgba(255, 255, 255, 0) 72%);
      animation: ripple 620ms var(--ease-out) forwards;
      mix-blend-mode: screen;
    }

    input {
      min-height: 44px;
      width: 100%;
      border: 1px solid rgba(103, 122, 104, 0.2);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.78);
      color: var(--text);
      padding: 0 14px;
      outline: none;
      transition:
        border-color 180ms var(--ease-out),
        box-shadow 180ms var(--ease-out),
        background-color 180ms var(--ease-out),
        transform 180ms var(--ease-out);
    }

    input::placeholder {
      color: rgba(99, 113, 100, 0.72);
    }

    input:hover {
      border-color: rgba(88, 122, 113, 0.28);
      background: rgba(255, 255, 255, 0.88);
    }

    input:focus {
      border-color: rgba(88, 122, 113, 0.62);
      box-shadow: 0 0 0 4px rgba(88, 122, 113, 0.12);
      background: #fff;
    }

    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    #app::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0) 52%),
        linear-gradient(315deg, rgba(94, 126, 97, 0.06), rgba(94, 126, 97, 0) 58%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0));
      opacity: 1;
    }

    .page {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 38px 28px 30px;
      gap: 28px;
      animation: fade-up 420ms var(--ease-out) both;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 48px;
      padding: 4px 2px 0;
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .topbar-right {
      justify-content: flex-end;
      margin-left: auto;
    }

    .user-pill,
    .count-pill {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      padding: 0 12px;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.58);
      border: 1px solid rgba(111, 132, 111, 0.18);
      color: var(--muted);
      white-space: nowrap;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(14px) saturate(1.12);
      -webkit-backdrop-filter: blur(14px) saturate(1.12);
    }

    .ghost-btn {
      border-color: rgba(103, 122, 104, 0.2);
      background: rgba(255, 255, 255, 0.56);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(12px) saturate(1.08);
      -webkit-backdrop-filter: blur(12px) saturate(1.08);
    }

    .ghost-btn:hover {
      background: rgba(255, 255, 255, 0.86);
      border-color: rgba(88, 122, 113, 0.26);
    }

    .primary-btn {
      background: linear-gradient(180deg, rgba(101, 136, 126, 1), rgba(81, 114, 103, 1));
      color: #fff;
      border-color: rgba(81, 114, 103, 0.96);
      box-shadow: 0 12px 28px rgba(73, 102, 93, 0.18);
    }

    .primary-btn:hover {
      background: linear-gradient(180deg, rgba(92, 127, 117, 1), rgba(68, 99, 89, 1));
      border-color: rgba(68, 99, 89, 1);
      box-shadow: 0 16px 34px rgba(73, 102, 93, 0.24);
    }

    .danger-btn {
      background: rgba(159, 77, 77, 0.1);
      color: var(--danger);
      border-color: rgba(159, 77, 77, 0.2);
    }

    .danger-btn:hover {
      background: rgba(159, 77, 77, 0.15);
      border-color: rgba(159, 77, 77, 0.28);
    }

    .auth-wrap {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 54px 18px;
    }

    .auth-panel {
      width: min(100%, 460px);
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.76), rgba(250, 253, 250, 0.46)),
        linear-gradient(135deg, rgba(88, 122, 113, 0.06), rgba(255, 255, 255, 0) 50%),
        rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.42);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        0 28px 68px rgba(57, 79, 57, 0.12);
      backdrop-filter: blur(22px) saturate(1.16);
      -webkit-backdrop-filter: blur(22px) saturate(1.16);
      padding: 28px;
      animation: fade-up 500ms var(--ease-out) both;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 18px;
    }

    .segmented button {
      background: rgba(95, 129, 99, 0.08);
      border-color: rgba(95, 129, 99, 0.12);
      color: var(--muted);
    }

    .segmented button.active {
      background: linear-gradient(180deg, rgba(101, 136, 126, 1), rgba(81, 114, 103, 1));
      border-color: rgba(81, 114, 103, 0.96);
      color: #fff;
      box-shadow: 0 12px 24px rgba(73, 102, 93, 0.16);
    }

    .stack {
      display: grid;
      gap: 12px;
    }

    .password-field {
      position: relative;
    }

    .password-field input {
      padding-right: 52px;
    }

    .password-toggle {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      min-height: 40px;
      padding: 0;
      border-radius: 12px;
      border-color: transparent;
      background: transparent;
      color: var(--muted);
      display: grid;
      place-items: center;
    }

    .password-toggle:hover {
      background: rgba(88, 122, 113, 0.08);
      color: var(--text);
      transform: translateY(-50%) scale(1.02);
    }

    .password-toggle svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .auth-title {
      margin: 0 0 14px;
      font-size: 23px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .message {
      min-height: 20px;
      color: var(--danger);
      font-size: 13px;
      line-height: 1.4;
    }

    .main-home {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding: 4px 0 34px;
    }

    .home-grid {
      width: min(100%, 620px);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      align-self: center;
    }

    .library-entry {
      width: min(100%, 620px);
      min-height: 88px;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.68), rgba(255, 255, 255, 0.42)),
        linear-gradient(135deg, rgba(88, 122, 113, 0.08), rgba(255, 255, 255, 0) 48%),
        rgba(255, 255, 255, 0.56);
      border: 1px solid rgba(255, 255, 255, 0.36);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        0 20px 46px rgba(57, 79, 57, 0.1);
      backdrop-filter: blur(16px) saturate(1.08);
      -webkit-backdrop-filter: blur(16px) saturate(1.08);
      display: grid;
      place-items: center;
      font-size: 24px;
      font-weight: 650;
      letter-spacing: -0.02em;
      align-self: center;
    }

    .pager-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pager-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pager-btn {
      min-height: 38px;
      padding: 0 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.68);
      border-color: rgba(111, 132, 111, 0.16);
      box-shadow: var(--shadow-soft);
    }

    .pager-btn:hover {
      background: rgba(255, 255, 255, 0.9);
    }

    .pager-info {
      color: var(--muted);
      font-size: 13px;
    }

    .pager-btn:disabled {
      opacity: 0.45;
      box-shadow: none;
    }

    .feature-card {
      position: relative;
      overflow: hidden;
      min-height: 210px;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.42)),
        linear-gradient(135deg, rgba(88, 122, 113, 0.12), rgba(255, 255, 255, 0) 48%),
        linear-gradient(320deg, rgba(201, 190, 164, 0.16), rgba(255, 255, 255, 0) 46%);
      border: 1px solid rgba(255, 255, 255, 0.42);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.62),
        0 24px 54px rgba(57, 79, 57, 0.12);
      backdrop-filter: blur(18px) saturate(1.14);
      -webkit-backdrop-filter: blur(18px) saturate(1.14);
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: 650;
      letter-spacing: -0.02em;
      text-align: center;
      transition:
        transform 220ms var(--ease-out),
        box-shadow 220ms var(--ease-out),
        border-color 220ms var(--ease-out),
        background-color 220ms var(--ease-out),
        filter 220ms var(--ease-out);
      animation: fade-up 460ms var(--ease-out) both;
    }

    .feature-card:nth-child(2) {
      animation-delay: 90ms;
    }

    .feature-card:hover {
      transform: translateY(-4px);
      border-color: rgba(88, 122, 113, 0.28);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        0 28px 64px rgba(57, 79, 57, 0.16);
      filter: saturate(1.03);
    }

    .feature-card::before,
    .feature-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out);
    }

    .feature-card::before {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.36), rgba(255, 255, 255, 0) 42%);
      opacity: 0.9;
    }

    .feature-card::after {
      inset: 1px;
      border-radius: inherit;
      border: 1px solid rgba(255, 255, 255, 0.36);
      opacity: 0;
    }

    .feature-card:hover::after {
      opacity: 1;
    }

    .feature-card:active {
      transform: translateY(1px) scale(0.985);
    }

    .section-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 22px;
      min-height: 0;
    }

    .card-shell {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(251, 253, 251, 0.46)),
        linear-gradient(135deg, rgba(88, 122, 113, 0.06), rgba(255, 255, 255, 0) 48%),
        rgba(255, 255, 255, 0.74);
      border: 1px solid rgba(255, 255, 255, 0.38);
      border-radius: 22px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.62),
        0 20px 48px rgba(57, 79, 57, 0.1);
      backdrop-filter: blur(18px) saturate(1.12);
      -webkit-backdrop-filter: blur(18px) saturate(1.12);
      padding: 22px;
      animation: fade-up 420ms var(--ease-out) both;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .input-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: stretch;
    }

    .hint {
      min-height: 18px;
      font-size: 13px;
      color: var(--muted);
    }

    .search-row {
      display: grid;
      gap: 8px;
    }

    .import-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .import-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-results-shell {
      flex: 1;
      min-height: 0;
      display: grid;
      gap: 12px;
    }

    .search-results-panel {
      min-height: 180px;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.66), rgba(255, 255, 255, 0.46)),
        rgba(255, 255, 255, 0.58);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.54),
        0 18px 42px rgba(57, 79, 57, 0.08);
      backdrop-filter: blur(16px) saturate(1.1);
      -webkit-backdrop-filter: blur(16px) saturate(1.1);
      overflow: hidden;
    }

    .search-results-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px 12px;
      border-bottom: 1px solid rgba(111, 132, 111, 0.12);
      color: var(--muted);
      font-size: 13px;
    }

    .search-results-list {
      margin: 0;
      padding: 0;
      list-style: none;
      max-height: min(48vh, 420px);
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(88, 122, 113, 0.34) rgba(255, 255, 255, 0.22);
    }

    .search-results-list::-webkit-scrollbar {
      width: 10px;
    }

    .search-results-list::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.2);
    }

    .search-results-list::-webkit-scrollbar-thumb {
      background: rgba(88, 122, 113, 0.28);
      border: 2px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
    }

    .search-result-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 18px;
      border-bottom: 1px solid rgba(111, 132, 111, 0.12);
      animation: row-in 260ms var(--ease-out) both;
      animation-delay: var(--row-delay, 0ms);
    }

    .search-result-row:last-child {
      border-bottom: 0;
    }

    .search-result-word {
      min-width: 0;
      word-break: break-word;
      line-height: 1.5;
      font-weight: 500;
    }

    .empty-state {
      padding: 44px 16px;
      color: var(--muted);
      text-align: center;
    }

    .feature-card:first-child {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.44)),
        linear-gradient(135deg, rgba(88, 122, 113, 0.14), rgba(255, 255, 255, 0) 48%),
        linear-gradient(320deg, rgba(201, 190, 164, 0.12), rgba(255, 255, 255, 0) 44%);
    }

    .feature-card:last-child {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.44)),
        linear-gradient(135deg, rgba(74, 104, 142, 0.12), rgba(255, 255, 255, 0) 48%),
        linear-gradient(320deg, rgba(88, 122, 113, 0.1), rgba(255, 255, 255, 0) 44%);
    }

    .footer-bar {
      display: flex;
      justify-content: flex-end;
    }

    .footer-action {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 0;
      min-height: 0;
      font-size: 13px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .footer-action:hover {
      color: var(--text);
      transform: none;
    }

    .footer-action:active {
      opacity: 0.82;
    }

    .word-row .ghost-btn {
      min-height: 38px;
      padding: 0 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.64);
    }

    .word-row .ghost-btn:hover {
      background: rgba(255, 255, 255, 0.9);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(31, 42, 31, 0.24);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      animation: fade-in 180ms var(--ease-out) both;
    }

    .modal-card {
      width: min(100%, 420px);
      border-radius: 24px;
      padding: 24px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(250, 253, 250, 0.64)),
        linear-gradient(135deg, rgba(88, 122, 113, 0.08), rgba(255, 255, 255, 0) 48%),
        rgba(255, 255, 255, 0.76);
      border: 1px solid rgba(255, 255, 255, 0.46);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.62),
        0 28px 68px rgba(30, 42, 30, 0.22);
      backdrop-filter: blur(20px) saturate(1.16);
      -webkit-backdrop-filter: blur(20px) saturate(1.16);
      animation: fade-up 220ms var(--ease-out) both;
    }

    .modal-title {
      margin: 0 0 10px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .modal-text {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .review-shell {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding-bottom: 10px;
    }

    .review-stage {
      flex: 1;
      position: relative;
      display: grid;
      place-items: center;
      min-height: 0;
      touch-action: none;
      overflow: hidden;
      border-radius: 26px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.66), rgba(255, 255, 255, 0.3)),
        linear-gradient(180deg, rgba(246, 250, 246, 0.86), rgba(235, 243, 237, 0.76));
      border: 1px solid rgba(255, 255, 255, 0.34);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.62),
        0 26px 60px rgba(57, 79, 57, 0.12);
      backdrop-filter: blur(20px) saturate(1.14);
      -webkit-backdrop-filter: blur(20px) saturate(1.14);
      animation: fade-up 420ms var(--ease-out) both;
    }

    .review-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0) 34%),
        linear-gradient(300deg, rgba(88, 122, 113, 0.04), rgba(88, 122, 113, 0) 46%);
      opacity: 0.82;
    }

    .review-content {
      width: min(100%, 860px);
      display: grid;
      place-items: center;
      gap: 14px;
      padding: 100px 72px;
      border-radius: 20px;
      transition:
        transform 220ms var(--ease-out),
        opacity 220ms var(--ease-out),
        filter 220ms var(--ease-out);
      will-change: transform, opacity;
      text-align: center;
    }

    .review-word {
      font-size: clamp(52px, 10vw, 108px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.03;
      text-align: center;
      word-break: break-word;
      overflow-wrap: anywhere;
      animation: pop 280ms var(--ease-out);
    }

    .review-content[data-motion="next"] .review-word {
      animation: slide-next 280ms var(--ease-out);
    }

    .review-content[data-motion="prev"] .review-word {
      animation: slide-prev 280ms var(--ease-out);
    }

    .review-empty {
      font-size: 20px;
      color: var(--muted);
      text-align: center;
    }

    .review-footnote {
      padding-top: 8px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0;
    }

    .review-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 54px;
      height: 54px;
      padding: 0;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.34);
      color: var(--accent-strong);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.54),
        0 14px 30px rgba(57, 79, 57, 0.12);
      backdrop-filter: blur(16px) saturate(1.12);
      -webkit-backdrop-filter: blur(16px) saturate(1.12);
      display: grid;
      place-items: center;
      font-size: 28px;
      line-height: 1;
      transition:
        transform 200ms var(--ease-out),
        box-shadow 200ms var(--ease-out),
        background-color 200ms var(--ease-out),
        border-color 200ms var(--ease-out);
    }

    .review-nav:hover {
      transform: translateY(-50%) scale(1.03);
      background: rgba(255, 255, 255, 0.52);
      border-color: rgba(88, 122, 113, 0.22);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.58),
        0 18px 38px rgba(57, 79, 57, 0.14);
    }

    .review-nav:active {
      transform: translateY(-50%) scale(0.98);
    }

    .review-nav.left { left: 12px; }
    .review-nav.right { right: 12px; }

    .review-nav:disabled {
      opacity: 0.3;
      cursor: default;
      transform: translateY(-50%);
    }

    .review-nav:disabled:hover {
      transform: translateY(-50%);
    }

    @keyframes pop {
      from { opacity: 0; transform: translateY(10px) scale(0.98); filter: blur(6px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    @keyframes slide-next {
      from { opacity: 0; transform: translateX(22px) scale(0.975); filter: blur(6px); }
      to { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
    }

    @keyframes slide-prev {
      from { opacity: 0; transform: translateX(-22px) scale(0.975); filter: blur(6px); }
      to { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px) scale(0.992); filter: blur(8px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    @keyframes row-in {
      from { opacity: 0; transform: translateY(8px); filter: blur(5px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes ripple {
      from { opacity: 0.42; transform: translate(-50%, -50%) scale(0.12); }
      to { opacity: 0; transform: translate(-50%, -50%) scale(1); }
    }

    .soft-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      margin: 0;
    }

    @media (max-width: 760px) {
      .page {
        padding: 16px 14px 18px;
        gap: 14px;
      }

      .home-grid {
        grid-template-columns: 1fr;
      }

      .feature-card {
        min-height: 174px;
        font-size: 24px;
      }

      .input-row {
        grid-template-columns: 1fr;
      }

      .review-content {
        padding: 72px 20px;
      }

      .review-nav {
        width: 50px;
        height: 50px;
        font-size: 26px;
      }

      .card-shell,
      .auth-panel,
      .review-stage {
        backdrop-filter: blur(16px) saturate(1.08);
        -webkit-backdrop-filter: blur(16px) saturate(1.08);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html:focus-within {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

      .review-content,
      .review-stage,
      .page,
      .auth-panel,
      .card-shell,
      .feature-card,
      .word-row,
      .modal-card {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    const STORAGE_KEY = 'word-memory-lite-v1';
    const app = document.getElementById('app');
    const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');

    const state = {
      data: { users: [], currentUser: null },
      view: 'auth',
      authMode: 'login',
      authMessage: '',
      showPassword: false,
      pageMessage: '',
      pageMessageType: 'info',
      search: '',
      libraryPage: 0,
      reviewSession: null,
      showClearModal: false,
      importing: false
    };

    function prefersReducedMotion() {
      return reducedMotionQuery.matches;
    }

    function createRipple(button, event) {
      if (prefersReducedMotion()) return;
      const rect = button.getBoundingClientRect();
      if (!rect.width || !rect.height) return;

      const ripple = document.createElement('span');
      ripple.className = 'ripple';

      const size = Math.max(rect.width, rect.height) * 1.55;
      const clientX = typeof event.clientX === 'number' ? event.clientX : rect.left + rect.width / 2;
      const clientY = typeof event.clientY === 'number' ? event.clientY : rect.top + rect.height / 2;

      ripple.style.width = `${size}px`;
      ripple.style.height = `${size}px`;
      ripple.style.left = `${clientX - rect.left}px`;
      ripple.style.top = `${clientY - rect.top}px`;

      button.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove(), { once: true });
    }

    function clearPressedButtons() {
      app.querySelectorAll('button.is-pressed').forEach(button => {
        button.classList.remove('is-pressed');
      });
    }

    function bindSharedFeedback() {
      if (app.dataset.feedbackBound === 'true') return;
      app.dataset.feedbackBound = 'true';

      app.addEventListener('pointerdown', event => {
        const button = event.target.closest('button');
        if (!button || button.disabled) return;
        button.classList.add('is-pressed');
        createRipple(button, event);
      });

      document.addEventListener('pointerup', clearPressedButtons);
      document.addEventListener('pointercancel', clearPressedButtons);
      document.addEventListener('blur', clearPressedButtons, true);
      document.addEventListener('keyup', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          clearPressedButtons();
        }
      });
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.users)) {
            state.data.users = parsed.users.filter(user => user && typeof user.username === 'string' && typeof user.password === 'string' && Array.isArray(user.words));
            state.data.currentUser = typeof parsed.currentUser === 'string' ? parsed.currentUser : null;
          }
        }
      } catch (error) {
        state.data = { users: [], currentUser: null };
      }

      if (state.data.currentUser && !getCurrentUser()) {
        state.data.currentUser = null;
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
      } catch (error) {
        console.warn('save failed', error);
      }
    }

    function getCurrentUser() {
      return state.data.users.find(user => user.username === state.data.currentUser) || null;
    }

    function currentWords() {
      const user = getCurrentUser();
      return user ? user.words : [];
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function setMessage(message, type = 'info') {
      state.pageMessage = message;
      state.pageMessageType = type;
    }

    function setAuthMessage(message) {
      state.authMessage = message;
    }

    function togglePasswordVisibility() {
      state.showPassword = !state.showPassword;
      const passwordInput = document.getElementById('password-input');
      const passwordToggleBtn = document.getElementById('password-toggle-btn');
      if (passwordInput) {
        passwordInput.type = state.showPassword ? 'text' : 'password';
      }
      if (passwordToggleBtn) {
        passwordToggleBtn.setAttribute('aria-label', state.showPassword ? '隐藏密码' : '显示密码');
        passwordToggleBtn.setAttribute('aria-pressed', state.showPassword ? 'true' : 'false');
        passwordToggleBtn.innerHTML = `
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"></path>
            <circle cx="12" cy="12" r="3.2"></circle>
            ${state.showPassword ? '<path d="M4 20 20 4"></path>' : ''}
          </svg>
        `;
      }
    }

    function trimValue(value) {
      return value.trim();
    }

    function goTo(view) {
      state.view = view;
      if (view === 'review') {
        startReviewSession();
      } else {
        state.reviewSession = null;
      }
      render();
    }

    function logout() {
      state.data.currentUser = null;
      state.reviewSession = null;
      state.showClearModal = false;
      state.view = 'auth';
      state.authMode = 'login';
      state.authMessage = '';
      state.libraryPage = 0;
      state.pageMessage = '';
      saveState();
      render();
    }

    function register(username, password) {
      const name = trimValue(username);
      const pass = trimValue(password);

      if (!name) {
        setAuthMessage('用户名不能为空。');
        return;
      }
      if (!pass) {
        setAuthMessage('密码不能为空。');
        return;
      }
      if (state.data.users.some(user => user.username === name)) {
        setAuthMessage('用户名已存在。');
        return;
      }

      state.data.users.push({ username: name, password: pass, words: [] });
      state.data.currentUser = name;
      state.view = 'home';
      state.authMessage = '';
      state.libraryPage = 0;
      state.pageMessage = '';
      saveState();
      render();
    }

    function login(username, password) {
      const name = trimValue(username);
      const pass = trimValue(password);

      if (!name || !pass) {
        setAuthMessage('用户名和密码都要填好哦~');
        return;
      }

      const user = state.data.users.find(item => item.username === name);
      if (!user || user.password !== pass) {
        setAuthMessage('账号或密码错误。');
        return;
      }

      state.data.currentUser = name;
      state.view = 'home';
      state.authMessage = '';
      state.libraryPage = 0;
      state.pageMessage = '';
      saveState();
      render();
    }

    function addWord(word) {
      const value = trimValue(word);
      if (!value) {
        setMessage('先输入一个单词再加进去哦~', 'error');
        render();
        return;
      }

      const user = getCurrentUser();
      if (!user) return;
      if (user.words.includes(value)) {
        setMessage('这个单词已经在词库里啦~', 'info');
        render();
        return;
      }

      user.words.push(value);
      state.reviewSession = null;
      state.pageMessage = '添加成功啦~';
      state.pageMessageType = 'info';
      saveState();
      render();
    }

    function deleteWord(index) {
      const user = getCurrentUser();
      if (!user) return;
      user.words.splice(index, 1);
      setMessage('已经删掉啦~', 'info');
      saveState();
      render();
    }

    function clearWords() {
      const user = getCurrentUser();
      if (!user) return;
      user.words = [];
      state.reviewSession = null;
      state.showClearModal = false;
      setMessage('词库已经清空啦~', 'info');
      saveState();
      render();
    }

    function normalizeImportedWords(rows) {
      const values = [];

      rows.forEach((row, rowIndex) => {
        if (!Array.isArray(row)) return;
        const cell = row.find(item => String(item ?? '').trim());
        const value = trimValue(String(cell ?? ''));
        if (!value) return;

        if (rowIndex === 0 && /^(word|words|单词|英文|vocabulary|vocab)$/i.test(value)) {
          return;
        }

        values.push(value);
      });

      return values;
    }

    async function importWordsFromFile(file) {
      const user = getCurrentUser();
      if (!user || !file) return;

      if (typeof XLSX === 'undefined') {
        setMessage('导入库还没加载成功，请稍后再试哦~', 'error');
        render();
        return;
      }

      state.importing = true;
      setMessage('正在导入中，请稍等一下哦~', 'info');
      render();

      try {
        const isCsv = file.name.toLowerCase().endsWith('.csv');
        const data = isCsv ? await file.text() : await file.arrayBuffer();
        const workbook = XLSX.read(data, { type: isCsv ? 'string' : 'array' });
        const sheetName = workbook.SheetNames && workbook.SheetNames[0];
        if (!sheetName) {
          throw new Error('empty workbook');
        }

        const sheet = workbook.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, blankrows: false, raw: false });
        const imported = normalizeImportedWords(rows);
        const exists = new Set(user.words);
        let added = 0;

        imported.forEach(word => {
          if (!exists.has(word)) {
            exists.add(word);
            user.words.push(word);
            added += 1;
          }
        });

        state.reviewSession = null;
        if (added > 0) {
          setMessage(`导入成功啦~ 新增了 ${added} 个单词。`, 'info');
        } else {
          setMessage('没有导入到新单词哦~', 'info');
        }
        saveState();
      } catch (error) {
        console.warn('import failed', error);
        setMessage('导入失败啦，请检查文件格式是不是 Excel 或 CSV 哦~', 'error');
      } finally {
        state.importing = false;
        render();
      }
    }

    function openClearModal() {
      state.showClearModal = true;
      render();
    }

    function closeClearModal() {
      state.showClearModal = false;
      render();
    }

    function startReviewSession() {
      const words = currentWords();
      if (!words.length) {
        state.reviewSession = { history: [], index: -1, motion: '' };
        return;
      }
      const first = words[Math.floor(Math.random() * words.length)];
      state.reviewSession = { history: [first], index: 0, motion: '' };
    }

    function currentReviewWord() {
      const session = state.reviewSession;
      if (!session || session.index < 0) return '';
      return session.history[session.index] || '';
    }

    function nextReviewWord() {
      const words = currentWords();
      if (!words.length) return;
      if (!state.reviewSession) startReviewSession();
      const session = state.reviewSession;
      session.motion = 'next';
      if (session.index < session.history.length - 1) {
        session.history = session.history.slice(0, session.index + 1);
      }
      const next = words[Math.floor(Math.random() * words.length)];
      session.history.push(next);
      session.index = session.history.length - 1;
      render();
    }

    function prevReviewWord() {
      if (!state.reviewSession || state.reviewSession.index <= 0) return;
      state.reviewSession.motion = 'prev';
      state.reviewSession.index -= 1;
      render();
    }

    function buildLibraryEntries(words, query) {
      return words
        .map((word, index) => ({ word, index }))
        .filter(item => !query || item.word.toLowerCase().includes(query));
    }

    function paginateEntries(entries, page, pageSize) {
      const totalPages = Math.max(1, Math.ceil(entries.length / pageSize));
      const safePage = Math.min(Math.max(0, page), totalPages - 1);
      const start = safePage * pageSize;
      return {
        totalPages,
        page: safePage,
        items: entries.slice(start, start + pageSize),
        start,
        end: Math.min(start + pageSize, entries.length)
      };
    }

    function renderLibraryRows(items, options = {}) {
      const { showIndex = true, showDelete = false, compact = false } = options;
      return items.map((item, filteredIndex) => `
        <li class="${compact ? 'home-library-item' : 'search-result-row'}" style="--row-delay:${filteredIndex * 18}ms;">
          <div class="${compact ? 'home-library-item-word' : 'search-result-word'}">${escapeHtml(item.word)}</div>
          ${showIndex && !compact ? `<button class="ghost-btn" type="button" data-delete-index="${item.index}">删除</button>` : ''}
          ${showIndex && compact ? `<div class="home-library-item-index">#${item.index + 1}</div>` : ''}
          ${showDelete && compact ? `<button class="ghost-btn" type="button" data-delete-index="${item.index}">删除</button>` : ''}
        </li>
      `).join('');
    }

    function renderPagerBar(page, totalPages, countText, scope) {
      const prevDisabled = page <= 0;
      const nextDisabled = page >= totalPages - 1;
      return `
        <div class="pager-bar">
          <div class="pager-info">${escapeHtml(countText)}</div>
          <div class="pager-group">
            <button class="pager-btn" type="button" data-library-page-nav="prev" data-library-page-scope="${scope}" ${prevDisabled ? 'disabled' : ''}>上一页</button>
            <span class="pager-info">第 ${page + 1} / ${totalPages} 页</span>
            <button class="pager-btn" type="button" data-library-page-nav="next" data-library-page-scope="${scope}" ${nextDisabled ? 'disabled' : ''}>下一页</button>
          </div>
        </div>
      `;
    }

    function renderAuth() {
      const isLogin = state.authMode === 'login';
      return `
        <div class="auth-wrap">
          <section class="auth-panel" aria-label="账号入口">
            <div class="segmented" role="tablist" aria-label="登录注册切换">
              <button class="${isLogin ? 'active' : ''}" data-auth-mode="login" type="button">登录</button>
              <button class="${!isLogin ? 'active' : ''}" data-auth-mode="register" type="button">注册</button>
            </div>
            <h1 class="auth-title">${isLogin ? '登录' : '注册'}</h1>
            <form id="auth-form" class="stack" autocomplete="on">
              <input id="username-input" name="username" autocomplete="username" maxlength="64" placeholder="用户名" required>
              <div class="password-field">
                <input id="password-input" name="password" type="${state.showPassword ? 'text' : 'password'}" ${isLogin ? 'autocomplete="current-password"' : 'autocomplete="new-password"'} maxlength="128" placeholder="密码" required>
                <button class="password-toggle" id="password-toggle-btn" type="button" aria-label="${state.showPassword ? '隐藏密码' : '显示密码'}" aria-pressed="${state.showPassword ? 'true' : 'false'}">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"></path>
                    <circle cx="12" cy="12" r="3.2"></circle>
                    ${state.showPassword ? '<path d="M4 20 20 4"></path>' : ''}
                  </svg>
                </button>
              </div>
              <button class="primary-btn" type="submit">${isLogin ? '登录' : '注册并登录'}</button>
              <div class="message">${escapeHtml(state.authMessage || '')}</div>
            </form>
          </section>
        </div>
      `;
    }

    function renderHome() {
      const user = getCurrentUser();
      const username = user ? user.username : '';
      return `
        <div class="page">
          <header class="topbar">
            <div class="topbar-left"></div>
            <div class="topbar-right">
              <div class="user-pill">当前用户：${escapeHtml(username)}</div>
              <button class="ghost-btn" id="logout-btn" type="button">退出登录</button>
            </div>
          </header>
          <main class="main-home">
            <div class="home-grid" aria-label="功能入口">
              <button class="feature-card" data-go="library" type="button">输入</button>
              <button class="feature-card" data-go="review" type="button">复现</button>
            </div>
            <button class="library-entry" data-go="library" type="button">词库</button>
          </main>
        </div>
      `;
    }

    function renderLibrary() {
      const words = currentWords();
      const entries = buildLibraryEntries(words, state.search.trim().toLowerCase());
      const pageData = paginateEntries(entries, state.libraryPage, 20);

      return `
        <div class="page">
          <header class="topbar">
            <div class="topbar-left">
              <button class="ghost-btn" data-go="home" type="button">← 返回主页</button>
            </div>
            <div class="topbar-right">
              <div class="count-pill">词库总数：${words.length}</div>
              <button class="ghost-btn" id="logout-btn" type="button">退出登录</button>
            </div>
          </header>

          <section class="section-shell">
            <div class="card-shell">
              <form id="add-form" class="form-grid">
                <div class="input-row">
                  <input id="word-input" maxlength="120" placeholder="输入单词">
                  <button class="primary-btn" type="submit">添加</button>
                </div>
                <div class="${state.pageMessageType === 'error' ? 'message' : 'hint'}">${escapeHtml(state.pageMessage || '')}</div>
              </form>
            </div>

            <div class="card-shell">
              <div class="import-row">
                <div class="hint">支持 Excel / CSV 导入哦~ 会自动去重。</div>
                <div class="import-actions">
                  <button class="ghost-btn" id="import-btn" type="button" ${state.importing ? 'disabled aria-busy="true"' : ''}>${state.importing ? '导入中...' : '导入 Excel'}</button>
                  <input id="excel-input" type="file" accept=".xlsx,.xls,.csv" hidden>
                </div>
              </div>
            </div>

            <div class="card-shell">
              <div class="search-row">
                <input id="search-input" value="${escapeHtml(state.search)}" placeholder="搜索单词">
                <div class="hint">支持模糊搜索哦~ 不区分大小写。</div>
              </div>
            </div>

            <div class="search-results-shell" id="word-results-shell">
              ${renderLibraryResults(entries, pageData)}
            </div>
          </section>
        </div>
      `;
    }

    function renderLibraryResults(entries, pageData) {
      const { page, totalPages, items, start, end } = pageData;
      if (!entries.length) {
        return `
          <div class="search-results-panel">
            <div class="empty-state">词库空空的，先放几个单词进去吧~</div>
          </div>
        `;
      }

      const totalText = `共 ${entries.length} 个单词`;
      return `
        <div class="search-results-panel">
          <div class="search-results-head">
            <div>${escapeHtml(totalText)}</div>
            <div>第 ${page + 1} / ${totalPages} 页 · ${start + 1}-${Math.max(start + items.length, 0)}</div>
          </div>
          ${items.length
            ? `
              <ul class="search-results-list">
                ${renderLibraryRows(items, { showDelete: true })}
              </ul>
              <div style="padding: 12px 18px 18px;">
                ${renderPagerBar(page, totalPages, `当前页显示 ${start + 1}-${end} 条`, 'library')}
              </div>
            `
            : `<div class="empty-state">没有找到符合的单词哦~</div>`}
        </div>
      `;
    }

    function updateLibraryList() {
      const shell = document.getElementById('word-results-shell');
      if (!shell) return;
      const words = currentWords();
      const entries = buildLibraryEntries(words, state.search.trim().toLowerCase());
      const pageData = paginateEntries(entries, state.libraryPage, 20);
      shell.innerHTML = renderLibraryResults(entries, pageData);
    }

    function renderReview() {
      const words = currentWords();
      const word = currentReviewWord();
      const hasWords = words.length > 0;
      const reviewMarkup = hasWords
        ? `
          <button class="review-nav left" id="prev-word-btn" type="button" ${state.reviewSession && state.reviewSession.index <= 0 ? 'disabled' : ''} aria-label="上一个">‹</button>
          <div class="review-content" id="review-content" data-motion="${escapeHtml(state.reviewSession?.motion || '')}">
            <div class="review-word">${escapeHtml(word)}</div>
          </div>
          <button class="review-nav right" id="next-word-btn" type="button" aria-label="下一个">›</button>
        `
        : `
          <div class="review-content" id="review-content">
            <div class="review-empty">请先添加单词</div>
          </div>
        `;

      return `
        <div class="page">
          <header class="topbar">
            <div class="topbar-left">
              <button class="ghost-btn" data-go="home" type="button">← 返回主页</button>
            </div>
            <div class="topbar-right">
              <div class="count-pill">总数：${words.length}</div>
              <button class="ghost-btn" id="logout-btn" type="button">退出登录</button>
            </div>
          </header>

          <section class="review-shell">
            <div class="review-stage" id="review-stage">
              ${reviewMarkup}
            </div>
            <div class="review-footnote">当前词库共有 ${words.length} 个单词哦~</div>
          </section>
        </div>
      `;
    }

    function render() {
      if (!state.data.currentUser) {
        state.view = 'auth';
      }

      app.innerHTML = state.view === 'auth'
        ? renderAuth()
        : state.view === 'home'
          ? renderHome()
          : state.view === 'library'
            ? renderLibrary()
            : renderReview();

      if (state.showClearModal) {
        app.innerHTML += `
          <div class="modal-backdrop" id="clear-modal-backdrop">
            <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="clear-modal-title">
              <h2 class="modal-title" id="clear-modal-title">清空词库？</h2>
              <p class="modal-text">这会删除当前账号里的所有单词，操作后不能恢复哦~</p>
              <div class="modal-actions">
                <button class="ghost-btn" id="clear-cancel-btn" type="button">取消</button>
                <button class="danger-btn" id="clear-confirm-btn" type="button">确认清空</button>
              </div>
            </div>
          </div>
        `;
      }

      bindInteractions();
    }

    function bindInteractions() {
      app.querySelectorAll('[data-go]').forEach(button => {
        button.addEventListener('click', () => {
          const target = button.dataset.go;
          if (target === 'review' && !currentWords().length) {
            state.search = '';
            state.pageMessage = '';
            goTo('review');
            return;
          }
          if (target === 'review' || target === 'library' || target === 'home') {
            state.search = '';
            state.pageMessage = '';
            goTo(target);
          }
        });
      });

      const logoutBtn = document.getElementById('logout-btn');
      if (logoutBtn) logoutBtn.addEventListener('click', logout);

      app.querySelectorAll('[data-library-page-nav]').forEach(button => {
        button.addEventListener('click', () => {
          const direction = button.dataset.libraryPageNav === 'next' ? 1 : -1;
          state.libraryPage = Math.max(0, state.libraryPage + direction);
          render();
        });
      });

      if (state.view === 'auth') {
        document.querySelectorAll('[data-auth-mode]').forEach(button => {
          button.addEventListener('click', () => {
            state.authMode = button.dataset.authMode;
            state.authMessage = '';
            state.showPassword = false;
            render();
          });
        });

        const form = document.getElementById('auth-form');
        const usernameInput = document.getElementById('username-input');
        const passwordInput = document.getElementById('password-input');
        const passwordToggleBtn = document.getElementById('password-toggle-btn');
        if (form && usernameInput && passwordInput) {
          form.addEventListener('submit', event => {
            event.preventDefault();
            if (state.authMode === 'login') {
              login(usernameInput.value, passwordInput.value);
            } else {
              register(usernameInput.value, passwordInput.value);
            }
          });
          usernameInput.focus();
        }
        if (passwordToggleBtn) {
          passwordToggleBtn.addEventListener('click', togglePasswordVisibility);
        }
        return;
      }

      if (state.view === 'library') {
        const addForm = document.getElementById('add-form');
        const wordInput = document.getElementById('word-input');
        const searchInput = document.getElementById('search-input');
        const resultsShell = document.getElementById('word-results-shell');
        const importBtn = document.getElementById('import-btn');
        const excelInput = document.getElementById('excel-input');

        if (state.search && searchInput) {
          searchInput.focus();
        } else if (wordInput) {
          wordInput.focus();
        }

        if (addForm && wordInput) {
          addForm.addEventListener('submit', event => {
            event.preventDefault();
            addWord(wordInput.value);
          });
        }

        if (searchInput) {
          searchInput.addEventListener('input', event => {
            state.search = event.target.value;
            state.libraryPage = 0;
            updateLibraryList();
          });
        }

        if (importBtn && excelInput) {
          importBtn.addEventListener('click', () => {
            excelInput.click();
          });
          excelInput.addEventListener('change', () => {
            const file = excelInput.files && excelInput.files[0];
            excelInput.value = '';
            if (file) importWordsFromFile(file);
          });
        }

        if (resultsShell) {
          resultsShell.addEventListener('click', event => {
            const target = event.target.closest('[data-delete-index]');
            if (!target) return;
            deleteWord(Number(target.dataset.deleteIndex));
          });
        }

        return;
      }

      if (state.view === 'review') {
        const stage = document.getElementById('review-stage');
        const prevBtn = document.getElementById('prev-word-btn');
        const nextBtn = document.getElementById('next-word-btn');
        const content = document.getElementById('review-content');

        if (prevBtn) prevBtn.addEventListener('click', prevReviewWord);
        if (nextBtn) nextBtn.addEventListener('click', nextReviewWord);

        if (stage && content && currentWords().length) {
          let startX = 0;
          let startY = 0;
          let lastDx = 0;
          let lastDy = 0;
          let dragging = false;

          const resetTransform = () => {
            content.style.transition = 'transform 0.18s ease, opacity 0.18s ease';
            content.style.transform = 'translateX(0px)';
            content.style.opacity = '1';
          };

          const onTouchStart = event => {
            const touch = event.touches[0];
            startX = touch.clientX;
            startY = touch.clientY;
            lastDx = 0;
            lastDy = 0;
            dragging = true;
            content.style.transition = 'none';
          };

          const onTouchMove = event => {
            if (!dragging) return;
            const touch = event.touches[0];
            lastDx = touch.clientX - startX;
            lastDy = touch.clientY - startY;
            if (Math.abs(lastDx) <= Math.abs(lastDy)) return;
            if (prefersReducedMotion()) return;
            event.preventDefault();
            const offset = lastDx * 0.35;
            content.style.transform = `translateX(${offset}px)`;
            content.style.opacity = String(Math.max(0.5, 1 - Math.min(Math.abs(offset) / 260, 0.45)));
          };

          const onTouchEnd = () => {
            if (!dragging) return;
            dragging = false;
            if (Math.abs(lastDx) > 60 && Math.abs(lastDx) > Math.abs(lastDy)) {
              if (lastDx > 0) {
                nextReviewWord();
              } else {
                prevReviewWord();
              }
              return;
            }
            resetTransform();
          };

          stage.addEventListener('touchstart', onTouchStart, { passive: true });
          stage.addEventListener('touchmove', onTouchMove, { passive: false });
          stage.addEventListener('touchend', onTouchEnd);
          stage.addEventListener('touchcancel', resetTransform);
          resetTransform();
        }
      }
    }

    document.addEventListener('keydown', event => {
      if (state.showClearModal && event.key === 'Escape') {
        closeClearModal();
        return;
      }
      if (state.view !== 'review') return;
      if (event.key === 'ArrowLeft') {
        event.preventDefault();
        prevReviewWord();
      } else if (event.key === 'ArrowRight') {
        event.preventDefault();
        nextReviewWord();
      }
    });

    loadState();
    state.view = state.data.currentUser ? 'home' : 'auth';
    if (state.data.currentUser) {
      state.authMode = 'login';
    }
    bindSharedFeedback();
    render();
  </script>
</body>
</html>
